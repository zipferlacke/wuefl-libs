<div class="card">
  <div class="card-head"><div class="dots"><span></span><span></span><span></span></div><span>Live-Generator</span></div>
  <div class="card-body" style="display:flex; flex-direction:column; gap:1rem;">
    <input type="text" id="qr-input" value="https://wuefl.de" style="font-family:var(--mono); font-size:.85rem; padding:.5rem .75rem; border:1px solid var(--line); border-radius:6px;">
    <div id="qr-target" data-content="https://wuefl.de" style="width:200px; height:200px;"></div>
  </div>
</div>

<script type="module">
import QRCodes from './qrcode-min.js';

const target = document.getElementById('qr-target');

function render() {
  target.dataset.content = document.getElementById('qr-input').value || ' ';
  QRCodes([target]);
}
render();

document.getElementById('qr-input').addEventListener('input', render);
</script>
